# LIPARUS layer contract — pure domain core, thin adapter, thin scripts.
# No module in this package imports `infrastructure`; the only `bond_api`
# import lives in the mission adapter.

pure_domain_core:  # must stay standalone (no bond_api, no infrastructure)
  - src/the_spy_who_loved_me/sub_tracking.py
  - src/the_spy_who_loved_me/tanker_capture.py
  - src/the_spy_who_loved_me/vehicle_forensics.py
  - src/the_spy_who_loved_me/acoustics.py
  - src/the_spy_who_loved_me/beamforming.py
  - src/the_spy_who_loved_me/hull_forensics.py
  - src/the_spy_who_loved_me/scenario.py

protocol_adapter:  # the only module allowed to import bond_api
  - src/the_spy_who_loved_me/mission.py

manuscript_hydration:
  - src/the_spy_who_loved_me/manuscript_variables.py

figures:
  - src/the_spy_who_loved_me/figures/plots.py

thin_scripts:
  - scripts/mission_cli.py
  - scripts/generate_figures.py
  - scripts/z_generate_manuscript_variables.py
