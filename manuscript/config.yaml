# The Spy Who Loved Me (1977) — LIPARUS — Special-Agent Mission Software
# PROJECT BOND film package (local-only working tree, never push).
# This meta-artifact links the manuscript prose to the deterministic domain
# core. It is loaded by yaml.safe_load inside manuscript_variables.py
# (paper section) and consumed by the publishing metadata beneath.

paper:
  # RASP Standard: title must be descriptive and objective.
  title: "The Spy Who Loved Me: LIPARUS — Special-Agent Mission Software"
  subtitle: "Passive Acoustic Detection, Bearing-Only Tracking, ULA Beamforming, Liparus-Class Tanker Capture, and Submersible Hull and Vehicle Forensics"
  version: "0.1.0"
  date: "2026-08-04"

authors:
  - name: "Daniel Ari Friedman"
    orcid: "0000-0001-6232-9096"
    email: "daniel@activeinference.institute"
    affiliation: "Active Inference Institute"
    corresponding: true

publication:
  # Local-only tree: no remote, no DOI. Metadata is kept minimal and honest.
  journal: "Active Inference Institute — PROJECT BOND LIPARUS"
  year: "2026"

keywords:
  - "passive acoustic detection"
  - "bearing-only target motion analysis"
  - "extended Kalman filter"
  - "passive sonar equation"
  - "underwater acoustic propagation"
  - "uniform linear array beamforming"
  - "Cramer-Rao bound"
  - "Liparus-class tanker capture"
  - "submersible vehicle forensics"
  - "pressure-hull collapse depth"
  - "deterministic simulation"

metadata:
  license: "MIT"
  language: "en"

# The LIPARUS mission identity declared by the MissionProvider.
