  codename: "LIPARUS"
  film: "The Spy Who Loved Me (1977)"
  phases: ["brief", "recon", "plan", "execute", "debrief"]
  package_version: "0.1.0"
  seed: 11

# Zero tolerance for test failure (guardrail).
testing:
  max_test_failures: 0
  max_project_test_failures: 0

# Rendering toggles; kept minimal for the local manuscript.
render:
