# LIPARUS claim ledger.
#
# Each entry names where a claim's value actually comes from. The `source`
# field is `<path> <symbol> [<symbol> ...]`; every path must exist and every
# identifier-shaped symbol must appear in that file — enforced by
# tests/test_repo_contracts.py::TestDocsAgreeWithTheRun. Three entries used to
# point at things that were not there (`manuscript_variables._track_metrics`
# never existed; the canonical bay dimensions live in `scenario.py`, not in
# `tanker_capture.py`).
claims:
  - claim_id: pfa-controlled
    kind: number
    value: 0.001
    source: src/the_spy_who_loved_me/sub_tracking.py DetectionConfig p_fa
    source_tier: project_source
    freshness: active
    artifact_path: output/figures/bearing_track.png
  - claim_id: tma-position-error
    kind: metric
    value: generated
    source: src/the_spy_who_loved_me/scenario.py run_canonical track_pos_err_m
    source_tier: generated_metric
    freshness: active
    artifact_path: output/data/manuscript_variables.json
  - claim_id: capture-clearance
    kind: number
    value: 1.5
    source: src/the_spy_who_loved_me/scenario.py clearance_m
    source_tier: project_source
    freshness: active
    artifact_path: output/figures/capture_feasibility.png
  - claim_id: liparus-hold-length
    kind: number
    value: 140
    source: src/the_spy_who_loved_me/scenario.py hold_length_m
    source_tier: project_source
    freshness: active
    artifact_path: output/figures/capture_feasibility.png
  - claim_id: capture-elapsed-time
    kind: declared_assumption
    value: 630
    # NOT a measured or derived duration: the sum of four uncited nominal
    # per-phase constants, invariant to submarine size and bay geometry.
    # Recorded here as an assumption so it is never re-read as a result.
    source: src/the_spy_who_loved_me/tanker_capture.py _PHASE_DURATIONS
    source_tier: declared_constant
    freshness: active
    artifact_path: output/data/manuscript_variables.json
  - claim_id: conversion-missing-critical
    kind: metric
    value: generated
    source: src/the_spy_who_loved_me/vehicle_forensics.py assess_conversion missing_critical
    source_tier: generated_metric
    freshness: active
    artifact_path: output/data/manuscript_variables.json
