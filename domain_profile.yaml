domain: deterministic_mission_software
display_name: The Spy Who Loved Me — LIPARUS (special-agent mission software)
required_packages:
  - numpy
  - matplotlib
  - pyyaml
  - bond-api
preferred_outputs:
  - pdf
  - html
validation_gates:
  - mission_protocol_conformance
  - determinism
  - coverage_tested
  - manuscript_token_hydration
figure_types:
  - bearing_track
  - capture_feasibility
  - conversion_readiness
citation_policy: official_or_scholarly
source_policy: "Prefer the deterministic domain core and scholarly acoustics/sonar references (Neyman-Pearson detection, bearing-only TMA observability)."
review_gates:
  - mission_protocol_conformance
  - manuscript_token_hydration
artifact_expectations:
  - output/data/manuscript_variables.json
  - output/data/mission_outcome.json
  - output/figures/bearing_track.png
  - output/figures/capture_feasibility.png
  - output/figures/conversion_readiness.png
llm_prompt_guidance: "Use the deterministic domain core and generated manuscript variables as the evidence source; do not invent numeric results."
